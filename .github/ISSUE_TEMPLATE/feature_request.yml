name: 功能建议
description: 建议新的产品能力或体验改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请先描述真实用户场景，而不只是实现方式。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: 本地数据、权限与 AI 影响
      description: 说明是否需要新权限、上传图片或产生模型费用。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可选方案
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交确认
      options:
        - label: 我已确认建议中不含真实凭据或个人数据。
          required: true
